name: Deploy
on:
  push:
    tags: ["v*"]
jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging          # automatic deployment
    steps:
      - uses: actions/checkout@v4
      - run: 'echo "staging deployment (e.g. az containerapp update …), then smoke test"'
  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production       # Environment protection rule: Required reviewers → runs only after the owner approves
    steps:
      - uses: actions/checkout@v4
      - run: echo "production deployment — only the approved owner can run this step"
