line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B"]
# FastAPI dependency injection uses Depends(...) as a default value, which is the standard pattern.
# Operations scripts (scripts/) have long guidance messages, so they are excluded from the line-length check.
extend-per-file-ignores = { "app/routers/*.py" = ["B008"], "scripts/**/*.py" = ["E501"] }
