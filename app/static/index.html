<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopFlow Orders & Refunds</title>
  <style>
    :root { --ink:#1f2328; --muted:#656d76; --line:#d0d7de; --brand:#6e40c9; --bg:#f6f8fa; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#24292f; color:#fff; padding:14px 28px; display:flex; align-items:center; gap:16px; }
    header h1 { font-size:18px; margin:0; letter-spacing:.2px; }
    header .env { margin-left:auto; font-size:12px; background:#444c56; padding:3px 10px; border-radius:12px; }
    nav { display:flex; gap:4px; padding:0 28px; background:#fff; border-bottom:1px solid var(--line); }
    nav button { border:0; background:none; padding:14px 18px; font-size:14px; cursor:pointer; color:var(--muted); border-bottom:3px solid transparent; }
    nav button.active { color:var(--ink); border-bottom-color:var(--brand); font-weight:600; }
    main { max-width:980px; margin:24px auto; padding:0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:18px; }
    h2 { font-size:16px; margin:0 0 12px; }
    select, input, textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:9px 8px; border-bottom:1px solid #eaeef2; }
    th { color:var(--muted); font-weight:600; font-size:12px; }
    .badge { display:inline-block; padding:2px 9px; border-radius:10px; font-size:12px; font-weight:600; background:#eaeef2; }
    .badge.vip { background:#f3e8ff; color:var(--brand); }
    .badge.APPROVED { background:#dafbe1; color:var(--ok); }
    .badge.REQUESTED { background:#fff8c5; color:var(--warn); }
    .badge.REJECTED { background:#ffebe9; color:var(--bad); }
    button.act { background:var(--brand); color:#fff; border:0; padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
    button.act.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
    .policy { color:var(--muted); font-size:13px; margin:6px 0 0; }
    .msg { margin-top:12px; padding:10px 12px; border-radius:6px; font-size:14px; }
    .msg.ok { background:#dafbe1; color:var(--ok); } .msg.err { background:#ffebe9; color:var(--bad); }
    .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <header><h1>ShopFlow Orders & Refunds</h1><span class="env" id="env">-</span></header>
  <nav>
    <button class="active" data-tab="customer">Customer view</button>
    <button data-tab="admin">Admin console</button>
  </nav>
  <main>
    <section id="tab-customer">
      <div class="card">
        <div class="row">
          <label for="customer">Customer</label>
          <select id="customer"></select>
          <span id="tier"></span>
        </div>
        <p class="policy" id="policy">Refunds can be requested within 30 days of purchase.</p>
      </div>
      <div class="card">
        <h2>Orders</h2>
        <table>
          <thead><tr><th>Order #</th><th>Order date</th><th>Amount</th><th>Status</th><th></th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
      <div class="card hidden" id="refund-card">
        <h2>Refund request · Order #<span id="refund-order"></span></h2>
        <div class="row">
          <label for="amount">Refund amount (KRW)</label>
          <input id="amount" type="number" min="1">
          <button class="act" id="submit-refund">Request refund</button>
          <button class="act ghost" id="cancel-refund">Close</button>
        </div>
        <div id="result"></div>
      </div>
    </section>

    <section id="tab-admin" class="hidden">
      <div class="card">
        <div class="row">
          <label for="token">Admin token</label>
          <input id="token" value="demo-admin-token">
          <button class="act" id="load-admin">Load pending approvals</button>
        </div>
      </div>
      <div class="card">
        <h2>Refunds pending approval</h2>
        <table>
          <thead><tr><th>Refund #</th><th>Order</th><th>Amount</th><th>Requested at</th><th></th></tr></thead>
          <tbody id="pending"></tbody>
        </table>
        <div id="admin-result"></div>
      </div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const won = (n) => "₩" + n.toLocaleString("en-US");
    let customers = [], selectedOrder = null;

    async function api(path, opts = {}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json", ...(opts.headers || {}) }, ...opts });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw body.detail || { message: "The request failed." };
      return body;
    }
    const tierBadge = (t) => (t || "").trim().toUpperCase() === "VIP" ? '<span class="badge vip">VIP</span>' : '<span class="badge">Standard</span>';

    async function loadCustomers() {
      customers = await api("/customers");
      $("customer").innerHTML = customers.map((c) => `<option value="${c.id}">${c.name}</option>`).join("");
      await showCustomer();
    }
    async function showCustomer() {
      const c = customers.find((x) => x.id == $("customer").value);
      $("tier").innerHTML = tierBadge(c && c.tier);
      const orders = await api(`/customers/${c.id}/orders`);
      $("orders").innerHTML = orders.map((o) => `<tr><td>#${o.id}</td><td>${o.ordered_at}</td><td>${won(o.total_amount)}</td>
        <td><span class="badge">${o.status}</span></td>
        <td><button class="act ghost" data-order="${o.id}" data-amount="${o.total_amount}">Refund</button></td></tr>`).join("");
      $("refund-card").classList.add("hidden");
    }
    $("customer").addEventListener("change", showCustomer);
    $("orders").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-order]"); if (!b) return;
      selectedOrder = b.dataset.order;
      $("refund-order").textContent = selectedOrder;
      $("amount").value = b.dataset.amount;
      $("result").innerHTML = "";
      $("refund-card").classList.remove("hidden");
    });
    $("cancel-refund").addEventListener("click", () => $("refund-card").classList.add("hidden"));
    $("submit-refund").addEventListener("click", async () => {
      try {
        const r = await api(`/orders/${selectedOrder}/refund`, { method: "POST", body: JSON.stringify({ amount: Number($("amount").value) }) });
        $("result").innerHTML = `<div class="msg ok">Refund #${r.id} submitted · Status <span class="badge ${r.status}">${r.status}</span></div>`;
      } catch (err) {
        $("result").innerHTML = `<div class="msg err">${err.message}</div>`;
      }
    });

    async function loadPending() {
      try {
        const list = await api("/admin/refunds?status=REQUESTED", { headers: { "X-Admin-Token": $("token").value } });
        $("pending").innerHTML = list.map((r) => `<tr><td>#${r.id}</td><td>#${r.order_id}</td><td>${won(r.amount)}</td><td>${r.requested_at.slice(0, 16).replace("T", " ")}</td>
          <td><button class="act" data-act="approve" data-id="${r.id}">Approve</button> <button class="act ghost" data-act="reject" data-id="${r.id}">Reject</button></td></tr>`).join("") || '<tr><td colspan="5">No refunds are pending approval.</td></tr>';
      } catch (err) { $("admin-result").innerHTML = `<div class="msg err">${err.message}</div>`; }
    }
    $("load-admin").addEventListener("click", loadPending);
    $("pending").addEventListener("click", async (e) => {
      const b = e.target.closest("button[data-act]"); if (!b) return;
      try {
        await api(`/admin/refunds/${b.dataset.id}/${b.dataset.act}`, { method: "POST", headers: { "X-Admin-Token": $("token").value } });
        $("admin-result").innerHTML = `<div class="msg ok">Refund #${b.dataset.id} processed</div>`; loadPending();
      } catch (err) { $("admin-result").innerHTML = `<div class="msg err">${err.message}</div>`; }
    });

    document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("active", x === b));
      $("tab-customer").classList.toggle("hidden", b.dataset.tab !== "customer");
      $("tab-admin").classList.toggle("hidden", b.dataset.tab !== "admin");
      if (b.dataset.tab === "admin") loadPending();
    }));

    api("/health").then((h) => { $("env").textContent = `${h.env} · v${h.version}`; });
    loadCustomers();
  </script>
</body>
</html>
